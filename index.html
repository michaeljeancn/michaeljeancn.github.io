function leafLabel(full){
  const [p,k]=String(full||'').split(':');
  const d=(LEAF_DEFS[p]||[]).find(x=>x.key===k);
  return d?d.label:'';

// 一个条目可以同时属于多个大类（例如插件型响度表既是工具也是效果器），
// 因此带多个三级叶子；it.leaf 只是主叶子，兼容卡片标签与旧版筛选字段。
function leafKeys(it){
  const out=[];
  for(const l of [it&&it.leaf, ...((it&&it.leaves)||[])]) if(l && !out.includes(l)) out.push(l);
  return out;
}
// 超过这个数量的大类 / 二级才需要再展开一层（构建期已保证它们都有下一层定义）
const LARGE=200;
// 旧数据/人工覆盖里可能出现乐器类旧 key，统一收敛成 inst + instSub
function normalizeCats(cats){
  const out=[]; let instSub=null;
  for(const raw of (Array.isArray(cats)?cats:[])){
    const c=INST_ALIAS[raw]||raw;
    if(INST_KEYS.includes(c)){ if(!instSub) instSub=c; if(!out.includes('inst')) out.push('inst'); }
    else if(!out.includes(c)) out.push(c);
  }
  return {cats:out.length?out:['other'], instSub};
}
function subOf(it,cat){
  const cats=it.category||[];
  if(cat==='fx') return cats.includes('fx')?((it.subs&&it.subs.fx)||it.fxSub||'other'):null;
  if(cat==='inst'){
    const n=normalizeCats(cats);
    if(!n.cats.includes('inst')) return null;
    const s=(it.subs&&it.subs.inst)||it.instSub||n.instSub||'synth';
    return INST_ALIAS[s]||s;   // 旧的 folk 一律归到 world
  }
  if(!cats.includes(cat)) return null;
  return (it.subs&&it.subs[cat])||it[cat+'Sub']||null;
}
// 卡片标签：主二级 + 对应三级（若有），大类标签仍由卡片原有逻辑渲染（可同时显示多个）
function subChip(it){
  const cats=it.category||[];
  const cat=['fx','inst','tools','samples','sampler'].find(c=>cats.includes(c)&&SUBS_BY_CAT[c]&&subOf(it,c));
  if(!cat) return '';
  const s=subOf(it,cat);
  const def=subDef(cat,s)||{};
  const color=def.color||CAT_COLORS[cat]||'#94a3b8';
  const label=def.label||subLabel(cat,s);
  const lf=leafKeys(it).find(l=>l.startsWith(s+':'));
  const lfl=lf?leafLabel(lf):'';
  const leaf=lfl?`<span class="cat leaf" style="--c:${color}">${esc(lfl)}</span>`:'';
  return `<span class="cat fxsub" style="--c:${color}">${esc(label)}</span>${leaf}`;
}

// 不重建静态数据、不重新部署、不必等每日 18:00。静态 JSON 里上次构建的固化值作为降级兜底。
let OV_LOCKED=new Map(), OV_READY=false;
function overridesUrl(){ return OVERRIDES_URL + (location.search || ''); }
async function loadOverrides(){
  try{
    const r=await fetch(overridesUrl(),{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d=await r.json();
    if(!d || !d.ok || d.degraded) throw new Error('覆盖表暂不可用');
    const m=new Map();
    for(const o of (d.overrides||[])){
      if(o && o.item_id && !o.allow_auto && Array.isArray(o.category) && o.category.length){
        m.set(String(o.item_id),{category:o.category,fx_sub:o.fx_sub||null});
      }
    }
    OV_LOCKED=m; OV_READY=true;
  }catch(e){
    // 读不到时不改动任何数据（静态里已有上次构建的固化结果），页面照常可用；
    // 保留上一次成功读到的 OV_LOCKED，避免云端抖动时把已生效的修正撤回。
    OV_READY=false;
  }
}
// 幂等：每次都从「自动基线」重新算，可反复调用（后台改完实时同步时用）。
// 只替换真正变化的条目对象，输入数组与 IndexedDB 缓存里的原始数据都不被修改。
function applyOverrides(items){
  if(!OV_READY || !Array.isArray(items)) return items;
  let changed=false;
  const out=items.map((it)=>{
    if(!it) return it;
    const manual=it.catSource==='manual';
    const rawBaseCats=(manual && Array.isArray(it.autoCategory) && it.autoCategory.length)?it.autoCategory:(it.category||[]);
    const baseNorm=normalizeCats(rawBaseCats);
    const baseCats=baseNorm.cats;
    const baseSub=(manual?it.autoFxSub:(baseCats.includes('fx')?(it.fxSub||null):null))||null;
    const baseInstSub=baseNorm.instSub || it.instSub || null;
    const ov=OV_LOCKED.get(String(it.id));
    const targetNorm=normalizeCats(ov?ov.category.slice():baseCats.slice());
    const targetCats=targetNorm.cats;
    // 目标二级：以构建期的 subs 为基线，只保留仍在目标大类里的分类；
    // fx 用覆盖表指定的子类，inst 用收敛后的乐器子类，其余沿用系统判定。
    const baseSubs=(it.subs&&typeof it.subs==='object')?it.subs:{};
    const targetSubs={};
    for(const c of Object.keys(SUBS_BY_CAT)){
      if(!targetCats.includes(c)) continue;
      let s=baseSubs[c]||it[c+'Sub']||null;
      if(c==='fx') s=ov?(ov.fx_sub||s||'other'):(s||'other');
      if(c==='inst') s=targetNorm.instSub||baseNorm.instSub||s||'synth';
      s=INST_ALIAS[s]||s;   // 旧修正里的 folk 统一收敛到 world
      if(s) targetSubs[c]=s;
    }
    // 三级标签只保留父级二级仍存在的；主叶子优先效果器，其次虚拟乐器
    const targetLeaves=leafKeys(it).filter(l=>Object.values(targetSubs).includes(String(l).split(':')[0]));
    const primary=targetLeaves.find(l=>targetSubs.fx&&l.startsWith(targetSubs.fx+':'))
      || targetLeaves.find(l=>targetSubs.inst&&l.startsWith(targetSubs.inst+':'))
      || targetLeaves[0]||null;
    const targetManual=!!ov;
    const same=JSON.stringify(it.category||[])===JSON.stringify(targetCats)
      && JSON.stringify(it.subs||{})===JSON.stringify(targetSubs)
      && JSON.stringify(leafKeys(it))===JSON.stringify(targetLeaves)
      && (it.catSource==='manual')===targetManual;
    if(same) return it;
    changed=true;
    const n={...it,category:targetCats,autoCategory:baseCats.slice(),autoFxSub:baseSub,subs:targetSubs,leaves:targetLeaves};
    if(targetSubs.fx) n.fxSub=targetSubs.fx; else delete n.fxSub;
    if(targetSubs.inst) n.instSub=targetSubs.inst; else delete n.instSub;
    for(const c of ['samples','tools','sampler']){
      const f=c+'Sub'; if(targetSubs[c]) n[f]=targetSubs[c]; else delete n[f];
    }
    if(primary) n.leaf=primary; else delete n.leaf;
    if(targetManual) n.catSource='manual'; else delete n.catSource;
    return n;
  });
  return changed?out:items;
}
function reapplyOverrides(){
  let changed=false;
  if(DATA.limited){ const n=applyOverrides(DATA.limited); if(n!==DATA.limited) changed=true; DATA.limited=n; }
  for(let i=0;i<DATA.freePages.length;i++){
    if(!DATA.freePages[i]) continue;
    const n=applyOverrides(DATA.freePages[i]);
    if(n!==DATA.freePages[i]) changed=true;
    DATA.freePages[i]=n;
  }
  return changed;
}

const CACHE_DB='fahcache', STORE='kv';

async function idbGet(k){try{const db=await idbOpen();return await new Promise((res)=>{const tx=db.transaction(STORE,'readonly').objectStore(STORE).get(k);tx.onsuccess=()=>res(tx.result);tx.onerror=()=>res(null);});}catch(e){return null;}}
async function idbSet(k,v){try{const db=await idbOpen();return await new Promise((res)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>res();});}catch(e){}}

// 限时免费：单文件，启动即在后台预载，保证一点开即可见
async function ensureLimited(){
  if(DATA.limited) return DATA.limited;
  const rev=revKey(); const key='limited-'+rev;
  try{ const c=await idbGet(key); if(c&&c.revision===rev&&Array.isArray(c.items)){ DATA.limited=applyOverrides(c.items); return DATA.limited; } }catch(e){}
  const r=await fetch(withV(LIMITED_FILE),{cache:'no-cache'}); const items=await r.json();

  DATA.limited=applyOverrides(items); try{ await idbSet(key,{revision:rev,items}); }catch(e){}

// 永久免费：按页异步加载，首页约 2MB，其余在滚动时按需加载
async function ensureFreePage(i){
  if(DATA.freePages[i]) return DATA.freePages[i];
  const rev=revKey(); const key='free-'+i+'-'+rev;
  try{ const c=await idbGet(key); if(c&&c.revision===rev&&Array.isArray(c.items)){ DATA.freePages[i]=applyOverrides(c.items); return DATA.freePages[i]; } }catch(e){}
  const r=await fetch(withV(freePageFile(i)),{cache:'no-cache'}); const items=await r.json();
  DATA.freePages[i]=applyOverrides(items); try{ await idbSet(key,{revision:rev,items}); }catch(e){}

}

/* ---------- 筛选核心 ---------- */
// 限免已过期（构建期写入 deadline=YYYY-MM-DD；当天仍算有效）→ 不展示
function isExpired(it){
  if(!it.deadline) return false;
  const end=new Date(it.deadline+'T23:59:59').getTime();
  return Date.now() > end;
}
function matchBase(it, skipCat, skipBrand){
  if(isExpired(it)) return false;
  if(!skipCat && state.cat){
    if(state.cat==='inst'){
      if(!normalizeCats(it.category||[]).cats.includes('inst')) return false;
    } else if(!(it.category||[]).includes(state.cat)) return false;
  }
  // 二级 / 三级筛选只在对应大类下生效；skipCat=true 时一并跳过（用于算大类别计数）
  if(!skipCat && state.sub && subOf(it,state.cat)!==state.sub) return false;
  if(!skipCat && state.leaf && !leafKeys(it).includes(state.leaf)) return false;
  if(!skipBrand && state.brand && it.brand!==state.brand) return false;
  const q=state.q.trim().toLowerCase();
  if(q){ const hay=((it.title||'')+' '+(it.brand||'')+' '+(it.summary||'')).toLowerCase(); if(!hay.includes(q)) return false; }
  return true;
}
function isFiltering(){ return !!(state.q.trim()||state.cat||state.brand||state.sub||state.leaf); }

function getFacetCounts(ds){
  const cat={}, brand={}, sub={}, leaf={}; let total=0;
  for(const c of Object.keys(SUBS_BY_CAT)) sub[c]={};
  for(const it of ds){
    if(matchBase(it,true,false)){
      total++;
      const cats=it.category||['other'];
      const seen=new Set();
      for(const raw of cats){
        const c=INST_KEYS.includes(INST_ALIAS[raw]||raw)?'inst':(INST_ALIAS[raw]||raw);
        if(seen.has(c)) continue; seen.add(c);
        cat[c]=(cat[c]||0)+1;
      }
      for(const c of Object.keys(sub)){
        const s=subOf(it,c);
        if(s) sub[c][s]=(sub[c][s]||0)+1;
      }
      for(const l of leafKeys(it)) leaf[l]=(leaf[l]||0)+1;
    }
    if(matchBase(it,false,true)){ const b=it.brand||'未知'; brand[b]=(brand[b]||0)+1; }
  }
  return {cat,brand,sub,leaf,total,fxSub:sub.fx||{},instSub:sub.inst||{}};
}

function sortList(list){
  const s=state.sort;
  const arr=list.slice();
  if(s==='name') arr.sort((a,b)=>(a.title||'').localeCompare(b.title||'', 'zh'));
  else if(s==='nameDesc') arr.sort((a,b)=>(b.title||'').localeCompare(a.title||'', 'zh'));
  else arr.sort((a,b)=>new Date(b.publishedAt||0)-new Date(a.publishedAt||0)); // 上架时间：最新在前
  return arr;
}

function dlDaysLeft(dstr){

function countSub(cat,key,counts){ return nodeCount((counts.sub[cat]||{})[key]||0,structSub(cat,key)); }

function visibleLeaves(sub,counts){ return (LEAF_DEFS[sub]||[]).filter(d=>countLeaf(`${sub}:${d.key}`,counts)>0); }

  if(state.sub){
    const leaves=visibleLeaves(state.sub,counts);
    segs.push({id:'sub',label:subLabel(cat,state.sub),count:countSub(cat,state.sub,counts),nav:'sub',hasChildren:leaves.length>0,
      pop: leaves.length
        ? {head:`${subLabel(cat,state.sub)} · 细分`,items:crumbLeafItems(state.sub,counts),
           all:{label:`全部 ${subLabel(cat,state.sub)}`,key:'',level:'leaf',parent:state.sub,
                count:countSub(cat,state.sub,counts)},current:state.leaf}
        : {head:`${catLabel(cat)} · 同级子分类`,items:crumbSubItems(cat,counts),
           all:{label:`全部 ${catLabel(cat)}`,key:'',level:'sub',count:countCat(cat,counts)},current:state.sub}});
  }
  if(state.leaf){
    const parent=state.sub||String(state.leaf).split(':')[0];
    segs.push({id:'leaf',label:leafLabel(state.leaf)||'细分',count:countLeaf(state.leaf,counts),nav:'leaf',hasChildren:false,
      pop:{head:`${subLabel(cat,parent)} · 同级细分`,items:crumbLeafItems(parent,counts),
           all:{label:`全部 ${subLabel(cat,parent)}`,key:'',level:'leaf',parent,
                count:countSub(cat,parent,counts)},current:state.leaf}});
  }
  const last=segs.length-1;
  // 只有「还有下一级」的段才给 ⌄：已经到最深的末段（弹层只能列同级）不再显示，
  // 避免和 Windows 地址栏里「展开下级」的箭头语义冲突。同级横跳仍可从父级弹层完成。
  if(CRUMB_OPEN && !segs.some((s,i)=>s.hasChildren && s.id===CRUMB_OPEN)) CRUMB_OPEN='';
  let h='<div class="crumbBar">';
  segs.forEach((s,i)=>{
    if(i) h+='<span class="crumbSep">›</span>';
    const showChev=!!s.hasChildren;
    const open=showChev && CRUMB_OPEN===s.id;
    h+=`<div class="crumbSeg${i===last?' cur':''}" data-seg="${esc(s.id)}">`;
    h+=`<button class="crumbBtn" type="button" data-nav="${esc(s.nav)}" title="${esc(crumbNavTitle(s.nav))}">${s.id==='root'?'<span class="crumbHome">⌂</span>':''}${esc(s.label)}${s.count!=null?` <b>${s.count}</b>`:''}</button>`;
    if(showChev) h+=`<button class="crumbChev${open?' on':''}" type="button" data-crumb-open="${esc(s.id)}" aria-label="查看${esc(s.pop.head)}" aria-expanded="${open}"><svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true"><path d="M2 4.5 6 8.5 10 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`;
    if(open) h+=crumbPopHtml(s.pop.head,s.pop.items,s.pop.all,s.pop.current);
    h+='</div>';
  });
  if(last>0) h+='<button class="crumbUp" type="button" data-crumb-up="1" title="回到上一级">↑ 上一级</button>';
  h+='<span class="crumbHint">点名称回到该层 · 点 ⌄ 展开下级 · ↑ 上一级</span>';
  h+='</div>';
  fxbar.innerHTML=h;
  // 弹层相对整条地址栏定位，并夹在可视宽度内，靠右侧展开时不会溢出屏幕
  const bar=fxbar.querySelector('.crumbBar'), pop=bar&&bar.querySelector('.crumbPop');
  const seg=bar&&bar.querySelector(`.crumbSeg[data-seg="${CRUMB_OPEN}"]`);
  if(bar&&pop&&seg){
    const max=Math.max(0,bar.clientWidth-pop.offsetWidth-10);
    pop.style.left=Math.max(6,Math.min(seg.offsetLeft-8,max))+'px';
  }
}
function populateDropdowns(ds){
  lastDropdownDs=ds;
  const counts=getFacetCounts(ds);
  lastFacets=counts;
  const {brand}=counts;
  // 类别：分组排序 + 近似配色 + 组标题；空分类隐藏，>200 且有下一层才显示「+」

      if(expandable && EXPANDED.cat.has(c)) ch+=subGroupHtml(c,counts);

    : '全部类别';
  // 厂商/作者（捕获全部厂商，搜索框内实时过滤；彩色胶囊 + 计数）
  currentBrandFacets=Object.keys(brand).map(n=>({name:n,count:brand[n]})).sort((a,b)=>b.count-a.count);
  renderBrandList(brandSearch?brandSearch.value:'');

function cardHtml(it){
  const hasImg=!!it.image;
  const phtext=esc(phTextOf(it));
  const phinner=phHtml(it);
  const img = hasImg ? `<img class="lazy" decoding="async" data-src="${esc(it.image)}" data-id="${esc(it.id)}" alt="${esc(it.title)}" loading="lazy">` : '';
  const isFree = it.type==='free' || (it.price||0)===0;
  const badge = isFree ? `<span class="badge">${esc(it.priceLabel||'免费')}</span>` : `<span class="badge limited">限时</span>`;
  const cats=(it.category||[]).slice(0,3).map(c=>`<span class="cat" style="--c:${esc(CAT_COLORS[c]||'#94a3b8')}">${esc(catLabel(c))}</span>`).join('')+subChip(it);
  const brand = it.brand ? `<span class="brand">厂商/作者：<b>${esc(it.brand)}</b></span>` : '';
  // 占位：有图时留空（仅骨架微光，加载失败才回退全称）；无图时直接显示厂商/作者全称
  const ph=`<div class="ph" data-text="${phtext}" data-html="${esc(phinner)}">${hasImg?'':`<span class="phTxt">${phinner}</span>`}</div>`;
  const isLimited = it.type==='limited';
  const dl = isLimited ? deadlineHtml(it) : '';
  return `<article class="card" tabindex="0" role="button" data-id="${esc(it.id)}" data-origin="${esc(it.origin||'api')}">
    <div class="thumb${hasImg?' loading':''}">${img}${ph}${badge}</div>
    <div class="body">
      <h3>${esc(it.title)}</h3>
      ${brand}
      <div class="cats">${cats}</div>
      <p class="desc">${highlightDL(it.summary||'')}</p>
      ${dl}
      <div class="foot">
        <div class="price">${priceHtml(it)}</div>
        <span class="more">详情 ↗</span>
      </div>
    </div>
  </article>`;
}

/* ---------- 图片懒加载（接近视口才请求，淡入 + 骨架微光） ---------- */
const imgIO=new IntersectionObserver((entries)=>{
  for(const e of entries){
    if(e.isIntersecting){
      const img=e.target, src=img.dataset.src;
      if(src){ img.src=src; }
      imgIO.unobserve(img);
    }
  }
},{rootMargin:'400px'});
function observeImages(root){
  (root||grid).querySelectorAll('img.lazy:not([src])').forEach(img=>{
    img.addEventListener('load',()=>{ img.classList.add('loaded'); const th=img.closest('.thumb'); if(th){ th.classList.remove('loading'); th.classList.add('loaded'); } });
    img.addEventListener('error',()=>{
      const th=img.closest('.thumb'); if(th) th.classList.remove('loading');
      img.style.display='none';
      // 图片加载失败：显示厂商/作者全称占位，避免出现空白
      const ph=th&&th.querySelector('.ph');
      if(ph && !ph.querySelector('.phTxt')){
        const sp=document.createElement('span'); sp.className='phTxt';
        sp.innerHTML=ph.dataset.html||esc(ph.dataset.text||'');
        ph.appendChild(sp);
      }
    });
    imgIO.observe(img);
  });
}

/* ---------- 渲染（分页 / 无限滚动） ---------- */
async function render(){
  if(brandSearch) brandSearch.value='';
  if(state.tab==='limited'){
    if(!DATA.limited){ try{ await ensureLimited(); }catch(e){ grid.innerHTML='<div class="empty">限时免费数据加载失败，请稍后刷新</div>'; return; } }
  } else {
    if(!DATA.freePages[0]){
      grid.innerHTML='<div class="empty">正在加载永久免费数据（第 1 页）…</div>';
      try{ await ensureFreePage(0); }catch(e){ grid.innerHTML='<div class="empty">数据加载失败，请稍后刷新</div>'; return; }
    }
  }
  const dsAll= state.tab==='limited' ? (DATA.limited||[]) : getFreeItems();
  const ds= dsAll.filter(it=>!isExpired(it));   // 已过期的限免不参与统计与筛选
  const full= sortList(ds.filter(it=>matchBase(it,false,false)));
  // 永久免费尚未全部载入、且用户在做检索/筛选 → 后台补齐全部页面以获得准确结果
  if(state.tab==='free' && !DATA.freeAllLoaded && isFiltering()){
    const total=META&&META.counts?META.counts.free:'—';
    grid.innerHTML=`<div class="empty">为准确检索全部 ${total} 条，正在加载剩余数据…</div>`;
    loadAllFree().then(()=>render()).catch(()=>{});
    return;
  }
  renderStats(ds.length, full.length);
  populateDropdowns(ds);
  updateMeta(ds, full.length);
  resetBtn.style.display=isFiltering()?'inline-flex':'none';

  renderList=full; renderIdx=0; grid.innerHTML='';
  if(!full.length){ grid.innerHTML='<div class="empty">暂无匹配结果，换个筛选或关键词试试～</div>'; updatePageStatus(); return; }
  appendChunk();
  updatePageStatus();
}
function appendChunk(){
  const frag=document.createElement('div');
  frag.style.display='contents';
  const end=Math.min(renderIdx+CHUNK, renderList.length);
  let html='';
  for(;renderIdx<end;renderIdx++) html+=cardHtml(renderList[renderIdx]);
  frag.innerHTML=html;
  grid.appendChild(frag);
  observeImages(grid);
}
// 滚动/点击加载更多时，不清空已渲染内容，仅把新载入的条目追加进来
function extendRenderList(){
  const ds=getFreeItems();
  const full=sortList(ds.filter(it=>matchBase(it,false,false)));
  renderList=full;            // 保持 renderIdx，沿用已渲染的卡片
  appendChunk();
  updatePageStatus();
}
function updateMeta(ds, matched){
  if(state.tab==='free'){
    const loaded=freeLoadedCount();
    const total=META&&META.counts?META.counts.free:'—';
    meta.textContent=`已加载 ${loaded} / 共 ${total} 条${isFiltering()?'（筛选后 '+matched+'）':''} · 更新于 ${META&&META.updatedAt?timeAgo(META.updatedAt):'—'}`;
  } else {
    meta.textContent=`共 ${matched} 条${isFiltering()?'（筛选后）':''} · 更新于 ${META&&META.updatedAt?timeAgo(META.updatedAt):'—'}`;
  }
}
function updatePageStatus(){
  const moreList=renderIdx<renderList.length;
  const morePages=state.tab==='free' && !DATA.freeAllLoaded;
  if(moreList||morePages){
    loadMoreBtn.style.display='block';
    if(morePages && !moreList){
      const remain=(META&&META.counts?META.counts.free:0)-freeLoadedCount();
      loadMoreBtn.textContent=`加载更多（还剩 ${remain} 条未载入）`;
    } else if(moreList){
      loadMoreBtn.textContent=`加载更多（剩 ${renderList.length-renderIdx} 条）`;
    } else { loadMoreBtn.textContent='加载更多'; }
  } else { loadMoreBtn.style.display='none'; }
}

  const buyLabel=it.purchaseLabel||(isFree?'前往领取':'前往购买');
  const buy=it.purchaseUrl?`<a class="buy" href="${esc(it.purchaseUrl)}" target="_blank" rel="noopener">${esc(buyLabel)} ↗</a>`:'';

  `;
  modal.classList.add('open'); modal.setAttribute('aria-hidden','false');

const dds=[ddCat,ddBrand,ddSort];
function closeAllDD(except){
  dds.forEach(d=>{ if(d!==except){ d.querySelector('.ddPanel').classList.remove('open'); d.querySelector('.ddBtn').classList.remove('open'); }});
}
function toggleDD(d){
  const panel=d.querySelector('.ddPanel'), btn=d.querySelector('.ddBtn');
  const open=panel.classList.toggle('open');
  btn.classList.toggle('open',open);
  closeAllDD(open?d:null);

// 展开 / 收起只重绘类别下拉，保留滚动位置，不动筛选条件、不关闭面板
function refreshCatDropdown(){
  const sc=listCat.scrollTop;
  populateDropdowns(lastDropdownDs||[]);
  listCat.scrollTop=sc;
}
dds.forEach(d=>{
  d.querySelector('.ddBtn').addEventListener('click',e=>{ e.stopPropagation(); toggleDD(d); });
  d.querySelector('.ddClose').addEventListener('click',e=>{ e.stopPropagation(); closeAllDD(); });
  // 面板内任意点击都不冒泡到 document，避免误关下拉
  d.querySelector('.ddPanel').addEventListener('click',e=>e.stopPropagation());
  d.querySelector('.ddList').addEventListener('click',e=>{
    // 「+」按钮：展开 / 收起下一层
    const exp=e.target.closest('.expBtn');
    if(exp){
      e.stopPropagation();
      const [kind,key]=String(exp.dataset.expand||'').split(':');
      const set=kind==='cat'?EXPANDED.cat:EXPANDED.sub;
      // 互斥展开：点新的会收起同层其它项，避免两层同时摊开又把面板撑得很长
      if(set.has(key)) set.delete(key); else { set.clear(); set.add(key); }
      if(kind==='cat') EXPANDED.sub.clear();
      refreshCatDropdown();
      return;
    }
    const pill=e.target.closest('.pill'); if(!pill) return;
    e.stopPropagation();
    // 二级 / 三级胶囊：data-subcat 指定大类，data-leaf 指定三级；再点一次可取消
    if(pill.dataset.sub!==undefined){
      const cat=pill.dataset.subcat||state.cat||'fx';
      const sub=pill.dataset.sub;
      const leaf=pill.dataset.leaf||'';
      const sameCat=state.cat===cat;
      state.cat=cat;
      if(leaf){
        state.sub=sub;
        state.leaf=(sameCat && state.leaf===leaf)?'':leaf;
      } else {
        state.sub=(sameCat && state.sub===sub && !state.leaf)?'':sub;
        state.leaf='';
      }
      CRUMB_OPEN='';
      closeAllDD(); render(); return;
    }
    const v=pill.dataset.value;
    if(d.dataset.key==='cat'){ state.cat=v; state.sub=''; state.leaf=''; CRUMB_OPEN=''; }
    else if(d.dataset.key==='brand') state.brand=v;
    else if(d.dataset.key==='sort') state.sort=v;
    closeAllDD();
    render();
  });
});

// 类别路径栏：名称回到该层，「⌄」弹出下一层 / 同级分类，选项直接切换筛选
fxbar.addEventListener('click',e=>{
  const ctl=e.target.closest('.crumbBtn,.crumbChev,.crumbOpt,.crumbUp');
  if(!ctl) return;
  e.stopPropagation();          // 避免 document 上的关闭逻辑把刚打开的弹层收掉
  if(ctl.classList.contains('crumbChev')){
    const id=ctl.dataset.crumbOpen;
    CRUMB_OPEN=CRUMB_OPEN===id?'':id;
    closeAllDD();
    if(lastFacets) renderFxBar(lastFacets);
    return;
  }
  if(ctl.classList.contains('crumbOpt')){
    const level=ctl.dataset.level, key=ctl.dataset.crumb||'', parent=ctl.dataset.parent||'';
    if(level==='root'||level==='cat'){ state.cat=key; state.sub=''; state.leaf=''; }
    else if(level==='sub'){ state.sub=key; state.leaf=''; }
    else if(level==='leaf'){ state.sub=key?key.split(':')[0]:(parent||state.sub); state.leaf=key; }
    CRUMB_OPEN='';
    closeAllDD(); render(); return;
  }
  if(ctl.classList.contains('crumbUp')){
    if(state.leaf) state.leaf='';
    else if(state.sub) state.sub='';
    else state.cat='';
    CRUMB_OPEN='';
    closeAllDD(); render(); return;
  }
  const lvl=ctl.dataset.nav;
  if(lvl==='root'){ state.cat=''; state.sub=''; state.leaf=''; }
  else if(lvl==='cat'){ state.sub=''; state.leaf=''; }
  else if(lvl==='sub'){ state.leaf=''; }
  else return;               // 末级名称本身就是当前位置，点击不改动
  CRUMB_OPEN='';
  closeAllDD(); render();
});

});
grid.addEventListener('click',e=>{ const c=e.target.closest('.card'); if(c) openDetail(findItem(c.dataset.id)); });
grid.addEventListener('keydown',e=>{ if(e.key==='Enter'){ const c=e.target.closest('.card'); if(c) openDetail(findItem(c.dataset.id)); } });
function findItem(id){ const ds=state.tab==='limited'?(DATA.limited||[]):getFreeItems(); return ds.find(x=>x.id===id)||null; }

/* 无限滚动：当“加载更多”按钮进入视口附近时自动触发，无需手动点击 */
const io=new IntersectionObserver((entries)=>{
  for(const e of entries){
    if(e.isIntersecting && loadMoreBtn.style.display!=='none' && !loadingPage){
      loadMoreBtn.click();
    }
  }
},{rootMargin:'400px'});
io.observe(loadMoreBtn);

/* ---------- 后台保存分类修正后：已打开的前台标签页即时同步，无需刷新 ---------- */
window.addEventListener('storage', async (e)=>{
  if(e.key!=='fah-overrides-signal') return;
  await loadOverrides();
  if(reapplyOverrides()){
    const y=window.scrollY;
    try{ await render(); }catch(err){}
    try{ window.scrollTo(0,y); }catch(err){}   // 不让自动同步把阅读位置顶回顶部
  }
});

/* ---------- 启动 ---------- */
(async function start(){
  try{ await loadMeta(); }catch(e){ meta.textContent='元数据加载失败'; }
  await loadOverrides();   // 必须在渲染前拿到覆盖表；接口不可用时内部已安全降级
  reapplyOverrides();      // 兜底：无限滚动等事件可能已提前加载了几页，这里统一补套用
  [...segEl.children].forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));
  ensureLimited();   // 后台预载限时免费，一点开即可见
  try{ await render(); }catch(e){ grid.innerHTML='<div class="empty">初始化失败，请刷新页面</div>'; }
})();

/* ---------- 即将到期提醒：读构建期简报；简报缺失 / 加载失败时静默隐藏，不影响主站 ---------- */
(function(){
  var bar=document.getElementById('expiryBar');
  if(!bar) return;
  var list=document.getElementById('expiryList'),
      toggle=document.getElementById('expiryToggle'),
      closeBtn=document.getElementById('expiryClose'),
      countEl=document.getElementById('expiryCount'),
      soonestEl=document.getElementById('expirySoonest');
  var KEY='fah-expiry-dismissed';
  // 与构建脚本 / 专题页一致：面向国内读者，按北京时间（UTC+8）判断「今天」
  var TODAY=new Date(Date.now()+8*3600000).toISOString().slice(0,10);
  var esc=function(s){ return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;'); };
  fetch('data-digest.json',{cache:'no-cache'}).then(function(r){ return r.ok?r.json():null; }).then(function(d){
    if(!d||!Array.isArray(d.expiringSoon)) return;
    var rows=d.expiringSoon.filter(function(x){
      return x && x.id && /^\d{4}-\d{2}-\d{2}$/.test(x.deadline||'');
    }).map(function(x){
      var cal=Math.round((Date.parse(x.deadline+'T00:00:00Z')-Date.parse(TODAY+'T00:00:00Z'))/86400000);
      // 与主站详情弹层 dlDaysLeft() 同口径：按本地时间 23:59:59 向上取整，避免同一条两处显示差 1 天
      var left=Math.max(0,Math.ceil((new Date(x.deadline+'T23:59:59').getTime()-Date.now())/86400000));
      return { id:x.id, title:x.title, brand:x.brand, deadline:x.deadline,
        calDays:cal, daysLeft:left };
    }).filter(function(x){
      return x.calDays>=0;                       // 简报若比今天旧，已过期的不再提醒
    }).sort(function(a,b){ return a.deadline.localeCompare(b.deadline)||a.daysLeft-b.daysLeft; });
    if(!rows.length) return;
    var sig=String(d.buildId||'')+':'+rows.map(function(x){ return x.id+'@'+x.deadline; }).join(',');
    try{ if(localStorage.getItem(KEY)===sig) return; }catch(e){}
    countEl.textContent=rows.length;
    soonestEl.textContent='，最近 '+rows[0].deadline.slice(5).replace('-','/')+' 截止 · 点开看清单';
    list.innerHTML=rows.map(function(x){
      var when=x.calDays===0?'今天最后一天':'还剩 '+x.daysLeft+' 天';
      return '<button class="expiryItem" type="button" data-id="'+esc(x.id)+'" title="'+esc(x.title)+'">'+
             '<span class="eTitle">'+esc(x.title)+'</span>'+
             '<span class="eWhen">'+esc(x.deadline.slice(5).replace('-','/'))+' · '+when+'</span></button>';
    }).join('');
    bar.hidden=false;
    toggle.addEventListener('click',function(){
      var open=list.hidden;
      list.hidden=!open;
      toggle.setAttribute('aria-expanded',open?'true':'false');
    });
    closeBtn.addEventListener('click',function(){
      bar.hidden=true;
      try{ localStorage.setItem(KEY,sig); }catch(e){}
    });
    list.addEventListener('click',function(e){
      var b=e.target.closest('.expiryItem'); if(!b) return;
      var id=b.dataset.id;
      var seg=document.querySelector('.segBtn[data-tab="limited"]');
      if(seg && state.tab!=='limited') seg.click();   // 走原有切换逻辑，不直接改 state
      var tries=0;
      (function tryOpen(){
        var it=findItem(id);
        if(it){ try{ openDetail(it); }catch(err){} return; }
        if(tries++<20) setTimeout(tryOpen,150);        // 等限免数据异步到位
      })();
    });
  }).catch(function(){ /* 简报不是主站渲染的依赖项，缺失时保持隐藏 */ });
})();
</script>
</body>
</html>
